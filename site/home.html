<title>Tool Shelf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root { --bg: #eef1f4; --panel: #fff; --fg: #1b2530; --muted: #5d6b79; --line: #d3dae1; --accent: #c25e00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #11171d; --panel: #19222b; --fg: #e6ebf0; --muted: #93a1ae; --line: #2b3742; --accent: #ff9a3c; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #11171d; --panel: #19222b; --fg: #e6ebf0; --muted: #93a1ae; --line: #2b3742; --accent: #ff9a3c; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; }
h1 { margin: 0 0 8px; }
a.tool { display: grid; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; color: inherit; text-decoration: none; }
a.tool:focus-visible { outline: 2px solid var(--accent); }
a.tool strong { color: var(--accent); font-size: 1.1rem; }
a.tool span { color: var(--muted); }
.tag { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
</style>
<div class="wrap">
  <h1>Tool Shelf</h1>
  <!--TOOLS-->
</div>
